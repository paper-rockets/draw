<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#18191c"/>
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- 3D Perspective Plane Grid -->
  <path d="M 96 380 L 256 310 L 416 380 L 256 450 Z" fill="none" stroke="url(#gridGrad)" stroke-width="3"/>
  <path d="M 136 362 L 256 330 L 376 362" fill="none" stroke="url(#gridGrad)" stroke-width="2"/>
  <path d="M 176 345 L 256 350 L 336 345" fill="none" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="256" y1="310" x2="256" y2="450" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="176" y1="345" x2="216" y2="415" stroke="url(#gridGrad)" stroke-width="2"/>
  <line x1="336" y1="345" x2="296" y2="415" stroke="url(#gridGrad)" stroke-width="2"/>
  <!-- 3D Spatial Sketch Ribbon Stroke -->
  <path d="M 120 330 C 130 180, 240 100, 360 130 C 420 150, 420 250, 330 280 C 240 310, 180 230, 220 170 C 250 130, 310 140, 340 180" 
        fill="none" 
        stroke="url(#curveGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Spatial Anchor Nodes -->
  <circle cx="120" cy="330" r="14" fill="#00e676"/>
  <circle cx="360" cy="130" r="12" fill="#00bcd4"/>
  <circle cx="340" cy="180" r="16" fill="#7c4dff"/>
</svg>